
name: Swift CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # JOB 1: Build and Unit Test
  build-test:
    name: Build and Unit Test
    runs-on: macos-latest

    steps:
      # Step 1: Checkout source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Build Swift application
      - name: Build Application
        run: |
          xcodebuild build-for-testing \
            -project TodoList.xcodeproj \
            -scheme TodoList \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO

      # Step 3: Run unit tests
      - name: Run Unit Tests
        run: |
          xcodebuild test-without-building \
            -project TodoList.xcodeproj \
            -scheme TodoList \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO

  # JOB 2: CodeQL Security Scanning
  security-scan:
    name: CodeQL Security Scan
    runs-on: macos-latest

    permissions:
      contents: read
      security-events: write

    steps:
      # Step 1: Checkout source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Initialize CodeQL
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual

      # Step 3: Build application for CodeQL analysis
      - name: Build Application
        run: |
          xcodebuild build \
            -project TodoList.xcodeproj \
            -scheme TodoList \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO

      # Step 4: Perform CodeQL security analysis
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
